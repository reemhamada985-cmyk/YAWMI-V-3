name: Build YAWMY APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare fully offline content
        run: bash scripts/prepare_offline_assets.sh

      - name: Verify offline bundle
        run: |
          test -f app/src/main/assets/index.html
          test -f app/src/main/res/raw/adhan.ogg
          test -f app/src/main/assets/data/hadith/bukhari.json
          test -f app/src/main/assets/data/hadith/muslim.json
          test $(find app/src/main/assets/quran-pages -type f -name '*.svg' | wc -l) -eq 604
          echo "Offline bundle verified."

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YAWMY-debug-apk-v1.0.3
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
