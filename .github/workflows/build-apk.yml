name: Build YAWMY APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Prepare offline content
        run: |
          if [ -f scripts/prepare_offline_content.sh ]; then
            bash scripts/prepare_offline_content.sh
          elif [ -f scripts/prepare_offline_content.py ]; then
            python3 scripts/prepare_offline_content.py
          else
            echo "No offline preparation script found; continuing."
          fi

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: YAWMY-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
